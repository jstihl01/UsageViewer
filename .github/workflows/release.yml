name: Windows release
on:
  workflow_dispatch:
    inputs:
      stable:
        description: 'Publicar como estable (requiere comprobaciones manuales completadas)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tools and scan secrets
        shell: pwsh
        run: |
          ./tools/Restore-Dependencies.ps1 -SecurityTools
          ./.build/gitleaks/gitleaks.exe git . --redact --report-format json --report-path .build/gitleaks.json
          if ($LASTEXITCODE) { throw 'Secret scan failed.' }
      - name: Verify dependency locks
        shell: pwsh
        run: ./tools/Test-Lockfiles.ps1
      - name: Build verified installer
        shell: pwsh
        run: ./build.ps1
      - name: Installer smoke test on disposable runner
        shell: pwsh
        run: ./tools/Test-Installer.ps1
      - name: Check regression mutations
        shell: pwsh
        run: ./tools/Test-Mutations.ps1
      - name: Archive durable verification evidence
        shell: pwsh
        run: |
          Compress-Archive -Path .build/test-results/*/*.trx,.build/installer-smoke/*,.build/mutation-results.json,.build/nuget-audit.json,.build/gitleaks.json,.build/inno-build.log -DestinationPath dist/UsageViewer-pruebas.zip -Force
      - name: Transfer verified delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-input
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: |
            .build/test-results/**/*.trx
            .build/installer-smoke/*
            .build/mutation-results.json
            .build/nuget-audit.json
            .build/gitleaks.json
            .build/inno-build.log
          retention-days: 30
  publish:
    needs: build
    runs-on: windows-2022
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-input
          path: dist
      - name: Verify transferred artifact digest
        shell: pwsh
        run: |
          $record=Get-Content dist/UsageViewer-provenance.json -Raw|ConvertFrom-Json
          if($record.commit -ne $env:GITHUB_SHA -or $record.workflowRun -ne $env:GITHUB_RUN_ID -or $record.sourceDirty){throw 'Wrong build origin.'}
          if((Get-FileHash dist/UsageViewer-Setup-x64.exe).Hash -ne $record.installer.sha256){throw 'Installer transfer mismatch.'}
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/UsageViewer-Setup-x64.exe
            dist/UsageViewer-SBOM.cdx.json
            dist/UsageViewer-package-manifest.json
            dist/UsageViewer-provenance.json
            dist/UsageViewer-pruebas.zip
      - name: Attest component inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/UsageViewer-Setup-x64.exe
          sbom-path: dist/UsageViewer-SBOM.cdx.json
      - name: Publish checked draft as prerelease by default
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          STABLE_RELEASE: ${{ inputs.stable }}
        run: |
          Copy-Item $env:PROVENANCE_BUNDLE dist/UsageViewer-provenance.sigstore.json
          Copy-Item $env:SBOM_BUNDLE dist/UsageViewer-SBOM.sigstore.json
          ./tools/Publish-Release.ps1 -Mode Prepare -Stable:($env:STABLE_RELEASE -eq 'true')
          ./tools/Publish-Release.ps1 -Mode Publish -Stable:($env:STABLE_RELEASE -eq 'true')
